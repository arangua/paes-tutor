# SonarQube Project Configuration
# https://docs.sonarqube.org/latest/analysis/scan/sonarscanner/

# Project identification
sonar.projectKey=paes-tutor
sonar.projectName=PAES Tutor
sonar.projectVersion=0.1.0
sonar.organization=arangua

# Source code location - Optimizado para plan gratuito
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Exclusions - Optimizado para plan gratuito (100k líneas máximo)
# Excluir: tests, configs, UI básicos, páginas Next.js, scripts, docs
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/prisma/**,**/e2e/**,**/*.config.*,**/*.d.ts,**/playwright-report/**,**/test-results/**,**/scripts/**,**/*.md,**/components/ui/**,**/app/**/page.tsx,**/app/**/layout.tsx,**/globals.css,**/src/test/**,**/types/**

# Test exclusions
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/.next/**

# TypeScript/JavaScript configuration
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Language
sonar.language=ts

# Coverage reports (generated by vitest)
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/test/**,**/e2e/**,**/*.config.*,**/*.d.ts,**/prisma/**

# Code analysis
sonar.typescript.tsconfigPath=tsconfig.json

# Duplication
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Issues
sonar.issue.ignore.multicriteria=e1,e2,e3

# Ignore test files for main code analysis
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.test.ts

sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S1192
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.test.tsx

sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S1192
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.spec.ts

