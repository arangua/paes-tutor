template: |
  ## Changes
  $CHANGES

name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "Dependencies"
    labels:
      - "deps"
  - title: "Governance / Baselines"
    labels:
      - "governance"
  - title: "CI / Guards"
    labels:
      - "ci"
  - title: "API"
    labels:
      - "api"
  - title: "UI"
    labels:
      - "ui"
  - title: "Tests"
    labels:
      - "tests"
  - title: "Documentation"
    labels:
      - "docs"

change-template: "- $TITLE (#$NUMBER) — @$AUTHOR"
no-changes-template: "- No changes."

# Disciplina: si no hay labels, cae aquí (útil para detectar PRs mal etiquetados)
category-template: "### $TITLE"

version-resolver:
  major:
    labels:
      - "release:major"
  minor:
    labels:
      - "release:minor"
  patch:
    labels:
      - "release:patch"
  default: patch

exclude-labels:
  - "skip-release-notes"
