name: Release Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout code (PR head)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Debug checkout HEAD
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "pr_head_sha=${{ github.event.pull_request.head.sha }}"
          echo "checked_out_sha=$(git rev-parse HEAD)"
          ls -la package-lock.json
          echo "sha256=$(sha256sum package-lock.json | awk '{print $1}')"
          echo "bytes=$(wc -c < package-lock.json)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Release Gate
        run: npm run ci:release
        env:
          NODE_ENV: production

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            .next/**
