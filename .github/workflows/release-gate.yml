name: Release Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: 'npm'

      - name: Debug lockfile fingerprint (pre)
        run: |
          echo "ref=$GITHUB_REF sha=$GITHUB_SHA"
          ls -la package-lock.json
          node -e "const fs=require('fs'),c=require('crypto'); const b=fs.readFileSync('package-lock.json'); console.log('sha256=',c.createHash('sha256').update(b).digest('hex')); console.log('bytes=',b.length)"

      - name: Install dependencies
        run: npm ci

      - name: Debug lockfile fingerprint (post)
        run: |
          ls -la package-lock.json
          node -e "const fs=require('fs'),c=require('crypto'); const b=fs.readFileSync('package-lock.json'); console.log('sha256=',c.createHash('sha256').update(b).digest('hex')); console.log('bytes=',b.length)"

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Release Gate
        run: npm run ci:release
        env:
          NODE_ENV: production

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            .next/**
