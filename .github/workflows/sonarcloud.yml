name: SonarCloud Analysis

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests with coverage (for Sonar)
        timeout-minutes: 25
        shell: bash
        run: npm run test:coverage -- --runInBand --testTimeout=30000

      - name: Assert LCOV exists
        shell: bash
        run: |
          ls -la coverage || true
          test -f coverage/lcov.info && echo "OK: coverage/lcov.info exists" || (echo "ERROR: coverage/lcov.info missing" && exit 1)

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

