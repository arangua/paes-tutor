name: SonarCloud Analysis

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests (without coverage due to open handles issue)
        timeout-minutes: 10
        run: npm run test:run -- --pool=threads --testTimeout=30000

      # TODO: Re-enable coverage once open handles issue is resolved
      # See: https://github.com/arangua/paes-tutor/issues/NEW
      # - name: Run tests with coverage
      #   run: npm run test:coverage

      - name: SonarCloud Scan (without coverage metrics)
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .

