name: SonarCloud Analysis

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for better analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests (coverage with watchdog) for Sonar
        shell: bash
        run: |
          set -euo pipefail
          rm -rf coverage || true
          mkdir -p coverage

          echo "Running vitest with coverage (watchdog)..."
          # Importante: timeout devuelve exit code 124 si mata el proceso.
          # Queremos aceptar 124 SOLO si ya existe coverage/lcov.info.
          set +e
          timeout --signal=SIGTERM 9m bash -lc \
            "npx vitest run --coverage --no-file-parallelism --testTimeout=30000"
          CODE=$?
          set -e

          echo "vitest/timeout exit code: $CODE"

          if [ -f coverage/lcov.info ] && [ -s coverage/lcov.info ]; then
            echo "✅ Found coverage/lcov.info (non-empty). Proceeding."
            # (opcional) info rápida para debug
            wc -l coverage/lcov.info || true
          else
            echo "::error title=LCOV missing::coverage/lcov.info was not produced (or is empty)."
            exit 1
          fi

      - name: Assert LCOV exists
        shell: bash
        run: |
          test -s coverage/lcov.info

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.typescript.lcov.reportPaths=coverage/lcov.info
