name: SonarCloud Analysis

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests with coverage
        timeout-minutes: 15
        shell: bash
        run: |
          # Run vitest with timeout, kill if it hangs after tests complete
          # The process hangs due to esbuild not exiting, but coverage is written
          timeout --signal=SIGTERM --kill-after=30s 5m \
            npm run test:coverage -- --pool=threads --coverage.provider=istanbul --testTimeout=30000 \
            || EXIT_CODE=$?

          # Exit code 124 means timeout killed it (expected if it hangs)
          # Exit code 0 means it finished normally
          # Any other code is a real failure
          if [ "${EXIT_CODE:-0}" -eq 124 ]; then
            echo "::warning::Vitest was killed by timeout (expected due to esbuild hang)"
          elif [ "${EXIT_CODE:-0}" -ne 0 ]; then
            echo "::error::Tests failed with exit code ${EXIT_CODE}"
            exit ${EXIT_CODE}
          fi

          # Verify coverage was generated before timeout
          if [ -f coverage/lcov.info ]; then
            echo "Coverage generated successfully"
          else
            echo "::error::Coverage file not generated"
            exit 1
          fi

      - name: Assert LCOV exists
        shell: bash
        run: |
          ls -la coverage || true
          test -f coverage/lcov.info && echo "OK: coverage/lcov.info exists" || (echo "ERROR: coverage/lcov.info missing" && exit 1)

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .

