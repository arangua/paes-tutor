# SonarQube Project Configuration
sonar.projectKey=arangua_paes-tutor
sonar.organization=arangua
sonar.host.url=https://sonarcloud.io
sonar.projectName=PAES Tutor
sonar.projectVersion=1.0.0

# Source code
sonar.sources=src
sonar.exclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx,**/node_modules/**,**/.next/**,**/out/**,**/build/**

# Test coverage
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Language
sonar.language=ts

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gates
sonar.qualitygate.wait=true

# --- Coverage (Vitest -> LCOV) ---
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# --- Coverage exclusions (PR #29) ---
sonar.coverage.exclusions=src/app/admin/import-exams/page.tsx,src/test/setup.ts

# --- JS/TS exclusions for PR New Code coverage ---
sonar.javascript.exclusions=src/app/admin/import-exams/page.tsx,src/test/setup.ts
sonar.typescript.exclusions=src/app/admin/import-exams/page.tsx,src/test/setup.ts
